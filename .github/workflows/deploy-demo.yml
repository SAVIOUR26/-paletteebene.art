name: Deploy demo (FTP)

on:
  push:
    branches:
      - claude/beautiful-euler-sxj7uy
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Deploy to demo7.thirdsan.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEMO_FTP_SERVER }}
          username: ${{ secrets.DEMO_FTP_USERNAME }}
          password: ${{ secrets.DEMO_FTP_PASSWORD }}
          server-dir: ${{ secrets.DEMO_FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
